name: Apply

on:
  push:
    branches: [main]
    paths:
      - 'environments/production/**'
      - 'bootstrap/tf-state/**'
  workflow_dispatch:
    inputs:
      target:
        description: Which environment to apply
        required: true
        default: production
        type: choice
        options:
          - production
          - demo-spoke

permissions:
  contents: read
  id-token: write

concurrency:
  group: apply-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.10.5'

jobs:
  apply:
    name: terraform apply (${{ github.event.inputs.target || 'production' }})
    runs-on: ubuntu-latest
    # Required reviewers + manual approval are configured at the GitHub environment level.
    environment: ${{ github.event.inputs.target || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Pick working directory
        id: dir
        run: |
          case "${{ github.event.inputs.target || 'production' }}" in
            production)  echo "path=environments/production" >> "$GITHUB_OUTPUT" ;;
            demo-spoke)  echo "path=spokes/demo-spoke"        >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown target"; exit 1 ;;
          esac

      - name: terraform init
        working-directory: ${{ steps.dir.outputs.path }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ github.event.inputs.target || 'production' }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: terraform apply
        working-directory: ${{ steps.dir.outputs.path }}
        env:
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_grafana_admin_password }}
          TF_VAR_remote_write_basic_auth_password: ${{ secrets.TF_VAR_remote_write_basic_auth_password }}
          TF_VAR_alertmanager_slack_webhook_url: ${{ secrets.TF_VAR_alertmanager_slack_webhook_url }}
        run: terraform apply -auto-approve -input=false
